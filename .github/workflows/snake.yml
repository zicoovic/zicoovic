name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"  # كل يوم منتصف الليل UTC
  workflow_dispatch:

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Generate GitHub Contribution Snake
        uses: Platane/snk@v3
        with:
          github_user_name: zicoovic
          outputs: snake.svg
